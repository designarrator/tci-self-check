<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기질·성격 7요인 검사</title>
<meta name="description" content="87문항, 8분. 타고난 기질 4가지와 살면서 자란 성격 3가지를 알아봐요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --grey-50:#F9FAFB;--grey-100:#F2F4F6;--grey-200:#E5E8EB;--grey-300:#D1D6DB;--grey-400:#B0B8C1;
  --grey-500:#8B95A1;--grey-600:#6B7684;--grey-700:#4E5968;--grey-800:#333D4B;--grey-900:#191F28;
  --primary:#4B5BD6;--primary-pressed:#3A48B8;--primary-subtle:#EEF0FC;
  --success:#1F9D6B;--danger:#E5484D;
  --bg:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--grey-100)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;color:var(--grey-900);
  word-break:keep-all;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow-x:hidden}
.display{font-size:28px;line-height:38px;font-weight:700;letter-spacing:-0.02em}
.title1{font-size:24px;line-height:34px;font-weight:700;letter-spacing:-0.02em}
.title2{font-size:20px;line-height:30px;font-weight:600;letter-spacing:-0.02em}
.body1{font-size:17px;line-height:27px}
.body2{font-size:15px;line-height:24px}
.caption{font-size:13px;line-height:19px}
.sub{color:var(--grey-600)}.weak{color:var(--grey-500)}
.num{font-variant-numeric:tabular-nums}
main{padding:0 20px}
main.has-cta{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.scr.fwd{animation:in-fwd .28s cubic-bezier(.22,1,.36,1)}
.scr.back{animation:in-back .28s cubic-bezier(.22,1,.36,1)}
@keyframes in-fwd{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes in-back{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.appbar{height:56px;display:flex;align-items:center;padding:0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;transition:transform .1s,background-color .1s}
.icon-btn:active{transform:scale(.94);background:var(--grey-100)}
.appbar .right{margin-left:auto;padding:0 12px;height:40px;border-radius:12px;color:var(--grey-600);font-size:15px;transition:transform .1s,background-color .1s}
.appbar .right:active{transform:scale(.97);background:var(--grey-100)}
.progress{height:4px;background:var(--grey-100);position:sticky;top:56px;z-index:5}
.progress>i{display:block;height:100%;background:var(--primary);transition:width .25s ease-out}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:15;
  padding:28px 20px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,rgba(255,255,255,0),var(--bg) 28px);display:flex;flex-direction:column;gap:4px}
.btn{height:56px;width:100%;border-radius:16px;background:var(--primary);color:#fff;font-size:17px;font-weight:600;
  transition:transform .1s,background-color .1s}
.btn:active{transform:scale(.97);background:var(--primary-pressed)}
.btn.secondary{background:var(--grey-100);color:var(--grey-800)}
.btn.secondary:active{background:var(--grey-200)}
.text-btn{height:44px;border-radius:12px;color:var(--grey-600);font-size:15px;font-weight:600;transition:transform .1s,background-color .1s}
.text-btn:active{transform:scale(.97);background:var(--grey-100)}
.note{text-align:center;color:var(--grey-500);font-size:13px;line-height:19px;padding-top:4px}

/* 랜딩 */
.hero-art{margin:24px 0 32px;aspect-ratio:4/3;border-radius:20px;background:var(--grey-50);display:grid;place-items:center}
.facts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;background:var(--grey-100);color:var(--grey-700);font-size:13px;display:inline-flex;align-items:center;font-weight:600}
.list{margin-top:32px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:16px;align-items:flex-start}
.row .dot{flex:none;width:40px;height:40px;border-radius:12px;background:var(--primary-subtle);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:15px}

/* 질문 */
.q-wrap{padding-top:24px}
.q-label{color:var(--grey-500);font-size:15px;line-height:24px;font-weight:600}
.statement{margin-top:8px;min-height:68px}
.statement.enter{animation:st-in .3s cubic-bezier(.22,1,.36,1)}
.statement.enter-back{animation:st-back .3s cubic-bezier(.22,1,.36,1)}
@keyframes st-in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes st-back{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.choices{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.choice{height:60px;border-radius:16px;border:1.5px solid var(--grey-200);background:#fff;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:600;text-align:left;
  transition:transform .1s,background-color .12s,border-color .12s,color .12s}
.choice:active{transform:scale(.98)}
.choice span{font-size:13px;font-weight:400;color:var(--grey-400)}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-subtle);color:var(--primary-pressed)}
.choice[aria-pressed="true"] span{color:var(--primary)}

/* 결과 */
.reveal{animation:reveal .6s cubic-bezier(.22,1,.36,1)}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.type-card{margin-top:20px;border-radius:20px;padding:28px 24px;color:#fff;
  background:linear-gradient(150deg,#4B5BD6 0%,#6E5BD0 55%,#8C6BC9 100%)}
.type-card .tag{font-size:13px;line-height:19px;opacity:.8;font-weight:600}
.type-card .display{margin-top:4px}
.type-card .body2{margin-top:12px;opacity:.92}
.type-card .axes{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap}
.type-card .axes b{height:28px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.section{margin-top:40px}
.section .caption{margin-top:4px}
.dims{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.dim{border-radius:16px;background:var(--grey-50);transition:background-color .12s}
.dim-head{width:100%;padding:16px;display:block;text-align:left;border-radius:16px;transition:transform .1s}
.dim-head:active{transform:scale(.98)}
.dim-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dim-name{font-size:17px;font-weight:600;line-height:27px}
.dim-score{font-size:15px;font-weight:600;color:var(--grey-700)}
.lvl{font-size:13px;font-weight:600;margin-left:6px}
.lvl.hi{color:var(--primary)}.lvl.mid{color:var(--grey-600)}.lvl.lo{color:var(--grey-700)}
.bar{margin-top:10px;height:8px;border-radius:999px;background:var(--grey-200);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--primary);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
.bar-legend{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--grey-500)}
.dim-body{display:none;padding:0 16px 18px}
.dim.open .dim-body{display:block}
.dim-body p{font-size:15px;line-height:24px;color:var(--grey-800)}
.subs{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.sub-row{display:grid;grid-template-columns:96px 1fr 32px;gap:10px;align-items:center;font-size:13px;color:var(--grey-700)}
.sub-row .bar{margin:0;height:6px}
.sub-row .bar>i{background:var(--grey-500)}
.sub-row b{font-weight:600;text-align:right}
.chev{transition:transform .2s;flex:none}
.dim.open .chev{transform:rotate(180deg)}
.tips{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.tip{padding:18px;border-radius:16px;background:var(--grey-50)}
.tip b{display:block;font-size:15px;line-height:24px}
.tip p{margin-top:4px;font-size:15px;line-height:24px;color:var(--grey-700)}
.card{padding:20px;border-radius:20px;background:var(--grey-50)}
.card .label{font-size:13px;line-height:19px;font-weight:600;color:var(--grey-500)}
.tip span.caption{display:block;margin-top:2px}
.feats{margin-top:8px}
.feat{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--grey-100)}
.feat:last-child{border-bottom:0}
.feat .score{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px}
.feat .score.hi{background:var(--primary-subtle);color:var(--primary)}
.feat .score.lo{background:var(--grey-100);color:var(--grey-700)}
.feat b{font-size:17px;line-height:27px;font-weight:600}
.feat p{margin-top:2px;font-size:15px;line-height:24px;color:var(--grey-700)}
.situ h3{font-size:17px;line-height:27px;font-weight:600;margin-top:20px}
.situ ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.situ li{position:relative;padding-left:14px;font-size:15px;line-height:24px;color:var(--grey-800)}
.situ li:before{content:'';position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--grey-400)}
.facet p{margin-top:4px;font-size:13px;line-height:20px;color:var(--grey-600)}
.subs{gap:16px}
.diverge{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff;font-size:13px;line-height:20px;color:var(--grey-700)}
.pro{font-size:13px;line-height:20px;color:var(--grey-600);padding:12px 14px;border-radius:12px;background:#fff}
.pro b{color:var(--grey-800);font-weight:600;margin-right:4px}
.synth{margin-top:16px;font-size:15px;line-height:25px;color:var(--grey-800)}
.rlist{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.rrow{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;padding:16px;border-radius:16px;background:var(--grey-50);transition:transform .1s,background-color .1s}
.rrow:active{transform:scale(.98);background:var(--grey-100)}
.rrow b{font-size:17px;line-height:27px;font-weight:600}
.rrow p{font-size:15px;line-height:24px;color:var(--grey-700);margin-top:2px}
.rstat{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.rstat.on{background:var(--primary-subtle);color:var(--primary)}
.quote{margin-top:12px;padding:12px 16px;border-left:3px solid var(--primary);background:var(--grey-50);border-radius:0 12px 12px 0;font-size:15px;line-height:24px;color:var(--grey-700)}
.ta{display:block;width:100%;margin-top:20px;min-height:160px;padding:16px;border-radius:16px;border:1.5px solid var(--grey-200);font:inherit;font-size:17px;line-height:27px;color:var(--grey-900);resize:vertical;outline:none;transition:border-color .12s}
.ta:focus{border-color:var(--primary)}
.qa{margin-top:20px;padding-bottom:20px;border-bottom:1px solid var(--grey-100)}
.qa .body1{margin-top:4px}
.aiq{margin-top:12px;font-size:20px;line-height:31px;font-weight:600;letter-spacing:-0.02em;white-space:pre-wrap;min-height:62px}
.aiq.wait,.report .wait{color:var(--grey-400);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.field{display:block;width:100%;height:56px;margin-top:24px;padding:0 16px;border-radius:16px;border:1.5px solid var(--grey-200);font:inherit;font-size:17px;outline:none}
.field:focus{border-color:var(--primary)}
.btn:disabled{background:var(--grey-200);color:var(--grey-500);transform:none}
.appbar .right:disabled{color:var(--grey-300)}
.ta:disabled{background:var(--grey-50)}
.err{margin-top:12px;padding:12px 14px;border-radius:12px;background:#FDECEC;color:var(--grey-800);font-size:15px;line-height:24px}
.err .text-btn{height:32px;padding:0 6px;color:var(--danger)}
.safety{margin-top:12px;padding:16px;border-radius:16px;background:var(--primary-subtle)}
.safety b{font-size:15px}.safety p{margin-top:4px;font-size:15px;line-height:24px;color:var(--grey-800)}
.safety a{color:var(--primary);font-weight:700}
.log{margin-top:28px}.log summary{font-size:15px;color:var(--grey-600);cursor:pointer;padding:8px 0}
.report{margin-top:20px}
.report h3{font-size:17px;line-height:27px;font-weight:600;margin-top:24px}
.report p,.report li{font-size:15px;line-height:25px;color:var(--grey-800);margin-top:6px}
.report ul{padding-left:18px}
.disclaimer{margin-top:40px;padding:16px;border-radius:16px;background:var(--grey-50);color:var(--grey-600);font-size:13px;line-height:20px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;
  background:var(--grey-800);color:#fff;font-size:15px;padding:12px 18px;border-radius:14px;transition:opacity .2s,transform .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,480px);transform:translate(-50%,100%);background:#fff;z-index:41;
  border-radius:24px 24px 0 0;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));transition:transform .32s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.sheet .handle{width:36px;height:4px;border-radius:4px;background:var(--grey-300);margin:0 auto 20px}
.sheet.show{transform:translate(-50%,0)}.sheet-bg.show{opacity:1}
.sheet .btns{display:flex;gap:8px;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

};
const ITEMS = [
 ['NS1','늘 같은 것보다 다양한 게 좋아요'],['NS1','새로운 곳에 가 보는 게 좋아요'],['NS1','아는 것만 계속하는 게 편해요',1],

 ['NS3','가진 돈보다 더 많이 쓸 때가 있어요'],['NS3','카드를 과하게 쓰는 편이에요'],['NS3','감당할 수 있는 만큼만 써요',1],
 ['NS4','규칙을 어길 때가 있어요'],['NS4','윗사람이나 권위에 맞서는 편이에요'],['NS4','규칙은 지키려고 해요',1],
 ['HA1','최악의 상황을 걱정해요'],['HA1','쉽게 스트레스를 받아요'],['HA1','대부분의 시간 동안 마음이 편해요',1],

function score(answers){
  const subSum={},subN={};
  ITEMS.forEach(it=>{const a=answers[it.id];if(a==null)return;const v=it.r?6-a:a;subSum[it.sub]=(subSum[it.sub]||0)+v;subN[it.sub]=(subN[it.sub]||0)+1;});
  const pct=(sum,n)=>Math.round((sum/n-1)/4*100);
  const dims={},subs={};
  Object.keys(DIMS).forEach(d=>{let s=0,n=0;Object.keys(subSum).filter(k=>k.replace(/\d/g,'')===d).forEach(k=>{s+=subSum[k];n+=subN[k];subs[k]=pct(subSum[k],subN[k]);});dims[d]=n?pct(s,n):0;});
  return {dims,subs};
}
const level=v=>v>=60?'hi':v<40?'lo':'mid';

function characterLine(d){

  const base=d.SD>=50&&d.C>=50?'스스로를 이끄는 힘과 함께하는 힘이 모두 자라 있어요.':d.SD>=50?'스스로를 이끄는 힘은 단단하고, 함께하는 힘은 더 자랄 여지가 있어요.':d.C>=50?'함께하는 힘이 좋고, 나만의 방향을 세우는 힘은 더 자랄 여지가 있어요.':'요즘 나를 이끄는 힘과 함께하는 힘이 조금 지쳐 있어요.';
  const tail=d.SD>=50?(weak?`그래서 기질의 약한 면(${weak})을 스스로 다룰 힘이 있어요.`:'그래서 기질의 장점을 원하는 방향으로 쓰기 좋은 상태예요.'):'성격이 자라면 같은 기질도 훨씬 성숙하게 드러나요. 기질은 잘 안 바뀌지만 성격은 키울 수 있어요.';
  return base+' '+tail;
}
// 공유 링크: 7개 점수만 담는다(답변 원본은 담지 않음)
const p2=v=>Math.max(0,Math.min(100,v)).toString(36).padStart(2,'0');
const encode=d=>Object.keys(DIMS).map(k=>p2(d[k])).join('');
const encodeAll=r=>encode(r.dims)+(r.subs?SUBKEYS.map(k=>p2(r.subs[k])).join(''):'');
function decode(s){
  if(!/^[0-9a-z]+$/.test(s||'')||(s.length!==14&&s.length!==14+SUBKEYS.length*2))return null;
  const n=i=>Math.min(100,parseInt(s.slice(i*2,i*2+2),36));
  const dims={};Object.keys(DIMS).forEach((k,i)=>dims[k]=n(i));
  let subs=null;if(s.length>14){subs={};SUBKEYS.forEach((k,i)=>subs[k]=n(7+i));}
  return {dims,subs};
}

## 대화 방식
- 한 번에: 사용자의 말을 짧게 비춰 주는 한 문장 + 열린 질문 정확히 하나. 전체 3문장 이내. 목록·제목·굵은 글씨 금지.
- 사용자의 실제 표현을 따옴표로 다시 써서, 내 말을 듣고 있다는 걸 느끼게 해요.
- 한 단계씩 더 깊이 들어가요: 구체적 장면 → 그때의 감정 → 그 밑의 바람·가치("그게 왜 중요해요?"를 표현을 바꿔 가며) → 뿌리(언제부터, 가족·학교·첫 직장에서 무엇이 칭찬받고 무엇이 혼났는지) → 이 성향이 나를 어떻게 지켜 줬는지 → 그 대가 → 남기고 싶은 것과 바꾸고 싶은 것.
- 기질은 타고나서 잘 안 바뀌고, 성격(자율성·연대감·자기초월)은 경험으로 자란다는 크로닝거의 관점을 쉬운 말로 써요. 세 번에 한 번쯤은 답과 점수를 잇는 가설을 질문 형태로 조심스럽게 건네요. 예: "즉흥성이 높은데, 말씀하신 '놓치면 다시 안 온다'는 마음이 그 속도를 더 키웠을 수도 있겠어요. 어떻게 느껴져요?"
- 답이 짧거나 막히면 더 쉬운 질문으로 바꾸거나 예시 두 개를 들어 줘요.
- 조언·해결책·평가는 하지 않아요. 판단 없이 궁금해해요.
- 열 번쯤 주고받았거나 핵심 이유가 드러났다면, 여기서 정리해 볼지 물어봐요.
- 한국어 해요체, 쉬운 말. 전문 용어는 꼭 필요할 때만 풀어서.

## 안전
자해·자살·학대·당장의 위험 신호가 보이면 탐색을 멈추고 따뜻하게 마음을 받아 준 뒤, 109(자살예방 상담전화, 24시간), 1577-0199(정신건강위기상담), 위급하면 112·119를 안내해요. 그 턴에는 왜 질문을 하지 않아요.`;
}
async function deepTurn(k,extra){
  const D=deepState(k),c=await claude();
  const stream=c.beta.messages.stream({
    model:MODEL,max_tokens:16000,
    betas:['server-side-fallback-2026-07-01'],fallbacks:'default',
    output_config:{effort:extra==='report'?'medium':'low'},
    cache_control:{type:'ephemeral'},
    system:systemPrompt(k),
    messages:D.msgs
  });
  const el=()=>document.getElementById('aiq');
  let acc='';
  for await(const ev of stream){
    if(ev.type==='content_block_delta'&&ev.delta.type==='text_delta'){acc+=ev.delta.text;const e=el();if(e){e.classList.remove('wait');e.textContent=acc;}}
  }
  const fin=await stream.finalMessage();
  const u=fin.usage||{};D.usage.i+=u.input_tokens||0;D.usage.o+=u.output_tokens||0;D.usage.cr+=u.cache_read_input_tokens||0;D.usage.cw+=u.cache_creation_input_tokens||0;
  if(fin.stop_reason==='refusal'){D.msgs.pop();save();throw Object.assign(new Error('refusal'),{refusal:true});}
  D.msgs.push({role:'assistant',content:fin.content});
  save();
  return textOf(fin.content);
}
function errMsg(e){
  if(e.refusal) return '이 대화는 AI가 이어 가기 어려워요. 마음이 힘들다면 109(24시간)로 이야기해 보세요.';
  const s=e.status;
  if(s===401) return 'API 키가 맞지 않아요. 키를 다시 확인해 주세요.';
  if(s===429) return '요청이 많아요. 잠시 뒤에 다시 눌러 주세요.';
  if(s>=500) return 'AI 쪽이 잠시 불안정해요. 다시 눌러 주세요.';
  return '연결이 안 됐어요. 인터넷을 확인하고 다시 눌러 주세요.';
}
const SAFETY=`<div class="safety"><b>지금 많이 힘드신가요?</b><p>혼자 견디지 않아도 돼요. <a href="tel:109">109</a>(자살예방 상담, 24시간), <a href="tel:15770199">1577-0199</a>(정신건강위기상담)에 전화하면 바로 이야기를 들어 줘요. 위급하면 112·119예요.</p></div>`;
function md(t){
  return esc(t).split('\n').map(l=>{
    if(/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /,'')}</h3>`;
    if(/^[-*] /.test(l)) return `<li>${l.slice(2)}</li>`;
    if(/^&gt; /.test(l)) return `<div class="quote">${l.slice(5)}</div>`;
    return l.trim()?`<p>${l}</p>`:'';
  }).join('').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`);
}
function KeyScreen(q){
  const has=!!localStorage.getItem(KEYSTORE);
  return `<div class="appbar"><button class="icon-btn" data-act="home" aria-label="뒤로">${ICON.back}</button></div>
  <main>
    <h1 class="title1" tabindex="-1" style="margin-top:8px">Claude API 키를 넣어 주세요</h1>
    <p class="body2 sub" style="margin-top:8px">AI가 답을 듣고 이어 묻는 데 써요. 키는 이 휴대폰 브라우저에만 저장되고, Anthropic API 말고는 어디로도 보내지 않아요.</p>
    <input class="field" id="keyin" type="password" autocomplete="off" placeholder="sk-ant-..." value="">
    <p class="caption weak" style="margin-top:8px">${has?'저장된 키가 있어요. 새로 넣으면 바뀌어요.':'Claude 콘솔의 API Keys에서 만들 수 있어요.'} 대화 한 번(10~15번 주고받기)에 보통 수백 원 정도 들어요.</p>
    <button class="btn" data-act="savekey" data-k="${q.get('k')||''}" style="margin-top:20px">저장하기</button>
    ${has?`<button class="text-btn" data-act="delkey" style="width:100%;margin-top:8px">저장된 키 지우기</button>`:''}
  </main>`;
}
function Deep(q){
  const m=S.history[0],k=q.get('k');if(!m||!m.subs||!FT[k])return Landing();
  if(!localStorage.getItem(KEYSTORE)){history.replaceState(null,'','#/key?k='+k);return KeyScreen(new URLSearchParams('k='+k));}
  const D=deepState(k);
  if(q.get('v')==='report'){
    return `<div class="appbar"><button class="icon-btn" data-act="todeep" data-k="${k}" aria-label="대화로">${ICON.back}</button></div>
    <main class="has-cta"><p class="body2 sub">${SUBNAME[k]} 들여다보기</p><h1 class="title1" tabindex="-1" style="margin-top:4px">이렇게 정리했어요</h1>
      <div class="report" id="aiq">${D.report?md(D.report):'<p class="wait">대화를 다시 읽고 정리하고 있어요</p>'}</div>
      <p class="caption weak" style="margin-top:24px">이번 대화 비용(추정) $${costOf(D.usage).toFixed(3)} · 입력 ${D.usage.i+D.usage.cr+D.usage.cw} 토큰 · 출력 ${D.usage.o} 토큰</p>
      <button class="text-btn" data-act="todeep" data-k="${k}" style="width:100%;margin-top:12px">대화 더 이어 가기</button>
    </main>
    <div class="cta"><button class="btn" data-act="copydeep" data-k="${k}" ${D.report?'':'disabled'}>리포트 복사하기</button></div>`;
  }
  const turns=D.msgs.filter(x=>x.role==='assistant');
  const last=turns[turns.length-1];
  const pending=D.msgs.length===0||D.msgs[D.msgs.length-1].role==='user';
  const userAns=D.msgs.filter(x=>x.role==='user').slice(1);
  const prev=userAns.length?textOf(userAns[userAns.length-1].content):'';
  const risky=userAns.some(x=>RISK.test(textOf(x.content)));
  const log=turns.slice(0,-1).map((a,j)=>`<div class="qa"><p class="caption weak">${esc(textOf(a.content))}</p><p class="body2">${esc(textOf((userAns[j]||{}).content))}</p></div>`).join('');
  return `<div class="appbar"><button class="icon-btn" data-act="toresult" aria-label="결과로">${ICON.back}</button>
      <span class="caption weak num" style="margin-left:4px">AI와 들여다보기 · ${Math.max(1,turns.length+(pending?1:0))}번째</span>
      <button class="right" data-act="deepreport" data-k="${k}" ${userAns.length>=3?'':'disabled'}>정리하기</button></div>
    <main class="q-wrap">
      <p class="q-label">${SUBNAME[k]} 들여다보기</p>
      ${risky?SAFETY:''}
      ${prev?`<div class="quote">${esc(prev.length>80?prev.slice(0,80)+'…':prev)}</div>`:''}
      <p class="aiq ${pending?'wait':''}" id="aiq" tabindex="-1">${pending?'답을 읽고 있어요':esc(textOf(last.content))}</p>
      <div id="derr"></div>
      <textarea class="ta" id="dta" rows="5" placeholder="떠오르는 대로 적어 보세요" ${pending?'disabled':''}></textarea>
      <button class="btn" data-act="deepsend" data-k="${k}" id="dsend" style="margin-top:16px" disabled>답하기</button>
      <p class="caption weak" style="margin-top:12px">세 번 이상 답하면 오른쪽 위 '정리하기'로 리포트를 만들 수 있어요.</p>
      ${log?`<details class="log"><summary>지금까지 대화 보기</summary>${log}</details>`:''}
      <div style="height:40px"></div>
    </main>`;
}
async function runDeep(k,mode){
  if(ui.busy)return;ui.busy=true;
  const D=deepState(k);
  try{
    if(mode==='report'){
      D.msgs.push({role:'user',content:'[정리 요청] 지금까지 대화를 바탕으로 정리 리포트를 써 주세요. 형식: "## 한 줄로" / "## 이 성향이 생긴 이유 (가설)" / "## 이 성향이 지켜 준 것" / "## 그 대가" / "## 기질과 성격으로 보면" / "## 앞으로 해볼 것 한 가지". 각 절은 2~4문장, 사용자가 한 말을 "> " 인용으로 한두 번 넣어요. 이유는 단정하지 말고 가설로 써요. 진단·처방 표현 금지, 해요체, 전체 700자 안팎.'});
      save();
      D.report=await deepTurn(k,'report');save();
    } else {
      if(D.msgs.length===0){D.msgs.push({role:'user',content:'시작해 주세요.'});save();}
      await deepTurn(k);
    }
  }catch(e){
    const q0=document.getElementById('aiq');if(q0&&mode!=='report'&&q0.classList.contains('wait')){q0.classList.remove('wait');q0.textContent='질문을 불러오지 못했어요';}
    const box=document.getElementById('derr');
    if(box) box.innerHTML=`<div class="err">${errMsg(e)} <button class="text-btn" data-act="deepretry" data-k="${k}" data-m="${mode||''}">다시 하기</button>${e.status===401?` <button class="text-btn" data-act="tokey" data-k="${k}">키 바꾸기</button>`:''}</div>`;
    else if(mode==='report'){const r=document.getElementById('aiq');if(r)r.innerHTML=`<div class="err">${errMsg(e)} <button class="text-btn" data-act="deepretry" data-k="${k}" data-m="report">다시 하기</button></div>`;}
    if(mode==='report'&&D.msgs.length&&D.msgs[D.msgs.length-1].role==='user'){D.msgs.pop();save();}
    ui.busy=false;bind();return;
  }
  ui.busy=false;
  if(route().p==='/deep')render();
}

/* ───────── 동작 ───────── */
let answering=false;
function bind(){
  ui.revealCard=false;ui.stDir=null;
  $app.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.act,el)));
  $app.querySelectorAll('.choice').forEach(el=>el.addEventListener('click',()=>pick(el)));
  const dta=$app.querySelector('#dta');
  if(dta){const b=$app.querySelector('#dsend');dta.addEventListener('input',()=>{b.disabled=!dta.value.trim()||ui.busy;});}
  const ta=$app.querySelector('#ta');
  if(ta){const btn=$app.querySelector('#rnext');ta.addEventListener('input',()=>{btn.textContent=ta.value.trim()?'다음':'건너뛰기';saveRef(btn.dataset.k,+btn.dataset.i);});}
}
function act(a,el){
  if(a==='start'){if(Object.keys(S.answers).length>=ITEMS.length){S.answers={};S.idx=0;save();}go('/q');}
  else if(a==='restart'){S.answers={};S.idx=0;save();go('/q');}
  else if(a==='home'){goBack('/');}
  else if(a==='last'){go('/result');}
  else if(a==='mine'){S.answers={};S.idx=0;save();history.replaceState(null,'','#/');ui.last=null;go('/q');}
  else if(a==='qback'){if(S.idx===0)return goBack('/');S.idx--;save();ui.stDir='enter-back';rerenderQ();}
  else if(a==='toggle'){const k=el.dataset.k;ui.open[k]=!ui.open[k];const d=el.closest('.dim');d.classList.toggle('open');el.setAttribute('aria-expanded',ui.open[k]);
    d.querySelectorAll('.sub-row .bar>i').forEach(b=>b.style.width=b.dataset.w+'%');}
  else if(a==='retake'){openSheet();}
  else if(a==='share'){share();}
  else if(a==='reflect'){go(`/reflect?k=${el.dataset.k}&i=0`);}
  else if(a==='toresult'){go('/result');}
  else if(a==='rnext'){const k=el.dataset.k,n=+el.dataset.i;saveRef(k,n);go(`/reflect?k=${k}&i=${n+1>=RQ.length?'done':n+1}`);}
  else if(a==='rback'){saveRef(el.dataset.k,+el.dataset.i);goBack('/result');}
  else if(a==='copyref'){copyRef(el.dataset.k);}
  else if(a==='deep'){go(`/deep?k=${el.dataset.k}`);}
  else if(a==='todeep'){go(`/deep?k=${el.dataset.k}`);}
  else if(a==='tokey'){go(`/key?k=${el.dataset.k}`);}
  else if(a==='savekey'){const v=$app.querySelector('#keyin').value.trim();if(!v.startsWith('sk-'))return toast('키 형식을 확인해 주세요');localStorage.setItem(KEYSTORE,v);_client=null;toast('키를 저장했어요');const k=el.dataset.k;if(k){history.replaceState(null,'','#/deep?k='+k);ui.last=null;render();}else goBack('/');}
  else if(a==='delkey'){localStorage.removeItem(KEYSTORE);_client=null;toast('키를 지웠어요');render();}
  else if(a==='deepsend'){const k=el.dataset.k,ta=$app.querySelector('#dta'),t=ta.value.trim();if(!t||ui.busy)return;
    const D=deepState(k);D.msgs.push({role:'user',content:t});save();ui.last=location.hash;render();}
  else if(a==='deepreport'){go(`/deep?k=${el.dataset.k}&v=report`);}
  else if(a==='deepretry'){const b=$app.querySelector('#derr');if(b)b.innerHTML='';runDeep(el.dataset.k,el.dataset.m||undefined);}
  else if(a==='copydeep'){const k=el.dataset.k,D=deepState(k);const t=`## ${SUBNAME[k]} — AI와 들여다보기 (${new Date().toLocaleDateString('ko-KR')})\n\n${D.report}\n\n### 대화\n`+D.msgs.slice(1).filter(x=>!/^\[정리 요청\]/.test(textOf(x.content))).map(x=>(x.role==='assistant'?'**Q.** ':'A. ')+textOf(x.content)).join('\n\n');
    navigator.clipboard.writeText(t).then(()=>toast('리포트를 복사했어요')).catch(()=>prompt('복사해 주세요',t));}
}
function rerenderQ(){
  const html=Question();const tmp=document.createElement('div');tmp.innerHTML=html;
  const scr=$app.firstElementChild;scr.className='scr';scr.innerHTML=tmp.innerHTML;bind();
}
function pick(el){
  if(answering)return;answering=true;
  navigator.vibrate?.(8);
  $app.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));
  const it=ITEMS[ORDER[S.idx]];S.answers[it.id]=+el.dataset.a;
  const wait=matchMedia('(prefers-reduced-motion: reduce)').matches?0:250;
  setTimeout(()=>{
    answering=false;
    if(S.idx<ITEMS.length-1){S.idx++;save();ui.stDir='enter';rerenderQ();}
    else{
      const r=score(S.answers);
      S.history=[{at:Date.now(),...r},...S.history].slice(0,5);S.answers={};S.idx=0;save();
      ui.reveal=true;ui.revealCard=true;ui.open={};
      ui.dir='fwd';history.replaceState(null,'','#/result');ui.last=null;render();
    }
  },wait);
}
document.addEventListener('keydown',e=>{
  if(route().p!=='/q')return;
  if(/^[1-5]$/.test(e.key))$app.querySelector(`.choice[data-a="${e.key}"]`)?.click();
  if(e.key==='Backspace')act('qback');
});
function saveRef(k,n){const ta=$app.querySelector('#ta');if(!ta)return;const m=S.history[0];S.reflect=S.reflect||{};const R=S.reflect[m.at]=S.reflect[m.at]||{};(R[k]=R[k]||[])[n]=ta.value;save();}
async function copyRef(k){
  const m=S.history[0],A=((S.reflect||{})[m.at]||{})[k]||[],v=m.subs[k];
  const md=`## ${SUBNAME[k]} 들여다보기 (${new Date().toLocaleDateString('ko-KR')})\n> ${firstSentence(FT[k][FI[flv(v)]])} — ${DIMS[SUBDIM[k]].name} 세부 척도 ${v}점\n\n`+RQ.map((r,j)=>A[j]?`**${r.q}**\n${A[j]}\n`:'').filter(Boolean).join('\n');
  try{await navigator.clipboard.writeText(md);toast('기록을 복사했어요');}catch{prompt('이 내용을 복사해 주세요',md);}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}
async function share(){
  const d=S.history[0].dims;const [t]=typeOf(d);
  const url=location.href.split('#')[0]+'#/result?s='+encodeAll(S.history[0]);
  const text=`나는 '${t}'래요. 기질·성격 7가지 결과 보고 너도 해봐요`;
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({title:'기질·성격 7요인 검사',text,url});}catch(e){} return;}
  try{await navigator.clipboard.writeText(text+'\n'+url);toast('링크를 복사했어요');}catch{prompt('이 링크를 복사해 주세요',url);}
}
function openSheet(){
  const bg=document.createElement('div');bg.className='sheet-bg';
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');
  sh.innerHTML=`<div class="handle"></div><h2 class="title2">처음부터 다시 할까요?</h2><p class="body2 sub" style="margin-top:4px">지금 결과는 첫 화면 '지난 결과'에 남아 있어요.</p>
    <div class="btns"><button class="btn secondary" data-x="no">닫기</button><button class="btn" data-x="yes">다시 하기</button></div>`;
  document.body.append(bg,sh);requestAnimationFrame(()=>{bg.classList.add('show');sh.classList.add('show');});
  const close=()=>{bg.classList.remove('show');sh.classList.remove('show');setTimeout(()=>{bg.remove();sh.remove();},220);};
  bg.onclick=close;sh.querySelector('[data-x=no]').onclick=close;
  sh.querySelector('[data-x=yes]').onclick=()=>{close();S.answers={};S.idx=0;save();go('/q');};
}
render();
</script>
